<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jigglypuff</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
    <section class="left">
        <img class="bubble-hey" src="img/pixel-speech-bubble.png" alt="Speech bubble: Hey Jigglypuff!">
        <button type="button">Press me</button>
    </section>
    <section class="right">
        <figure id="character">
            <img class="back" src="img/jigglypuff_back.gif" alt="Jigglypuff from behind">
            <img class="front" src="img/jigglypuff.gif" alt="Jigglypuff is looking at you">
        </figure>
        <figure id="speech_bubble">
            <img class="empty" src="img/pixel-speech-bubble.gif" alt="Empty speech bubble">
            <img class="text" src="img/jigglypuff_speech_bubble.png" alt="Speech bubble: Jigglypuff!">
        </figure>
    </section>
    <audio src="audio/jigglypuff.mp3"></audio>
</main>
</body>
</html>
